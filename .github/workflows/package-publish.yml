name: Publish package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without creating a release
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install libspandsp
        run: sudo apt-get update && sudo apt-get install -y libspandsp2t64 libspandsp-dev build-essential

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate package
        run: npx --yes clawhub@latest package validate .

      - name: Authenticate with ClawHub
        if: ${{ !inputs.dry_run }}
        run: |
          test -n "$CLAWHUB_TOKEN" || { echo "CLAWHUB_TOKEN secret is missing"; exit 1; }
          npx --yes clawhub@latest login --token "$CLAWHUB_TOKEN" --no-browser
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish to ClawHub
        run: |
          npx --yes clawhub@latest package publish . \
            --source-ref "$GITHUB_REF" \
            --wait \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
