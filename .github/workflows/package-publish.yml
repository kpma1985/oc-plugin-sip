name: Publish package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without creating a release
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install libspandsp
        run: sudo apt-get update && sudo apt-get install -y libspandsp2t64

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate package
        run: npx --yes clawhub@latest package validate .

      - name: Publish to ClawHub
        run: |
          npx --yes clawhub@latest package publish . \
            --owner 1337.so \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --wait
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
